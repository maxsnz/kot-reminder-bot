version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reminder
    container_name: reminder
    # network_mode: host — telegraf долбит api.telegram.org через
    # long-polling, плюс Prisma/Graphile коннектятся к локальному
    # Postgres на 127.0.0.1:5432. Хост-режим выбран для единообразия
    # с другими ботами на этом сервере (tasker, voice) и нативной
    # связи с loopback-Postgres'ом без NAT.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    healthcheck:
      # Проверяем свежесть liveness-heartbeat, который приложение обновляет
      # каждые 15с (см. src/index.ts), а не просто наличие bun в PID 1:
      # процесс может быть жив, а event loop — завис, и старый healthcheck
      # этого не ловил. Если heartbeat не обновлялся >1 мин → unhealthy.
      # find/-mmin есть в oven/bun:debian (procps/ps — нет).
      test: ["CMD-SHELL", "test -n \"$(find /tmp/reminder-heartbeat -mmin -1 2>/dev/null)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Ротация логов настраивается глобально в /etc/docker/daemon.json
    # (infra/roles/docker), per-service блок не нужен.
